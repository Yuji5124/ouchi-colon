[platformio]
default_envs = atoms3-signal-test

[env:atoms3-signal-test]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = m5stack/M5GFX@0.2.36
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DMOTOR_ALLOW_POWERED_TESTS=0

; Do not add an upload action to automation. User approval is required before flashing.

[env:atoms3-single-test]
extends = env:atoms3-signal-test
build_flags =
  ${env:atoms3-signal-test.build_flags}
  -DMOTOR_SINGLE_TEST=1

[env:atoms3-rc-test]
extends = env:atoms3-signal-test
build_flags =
  ${env:atoms3-signal-test.build_flags}
  -DMOTOR_RC_TEST=1

[env:atoms3-boot-test]
extends = env:atoms3-signal-test
build_flags =
  ${env:atoms3-signal-test.build_flags}
  -DMOTOR_BOOT_TEST=1

[env:atoms3-program]
extends = env:atoms3-rc-test
build_flags =
  ${env:atoms3-rc-test.build_flags}
  -DMOTOR_PROGRAM=1

[env:atoms3-boot-dual-test]
extends = env:atoms3-boot-test
build_flags =
  ${env:atoms3-boot-test.build_flags}
  -DMOTOR_BOOT_DUAL_TEST=1
