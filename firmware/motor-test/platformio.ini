[platformio]
default_envs = atoms3-signal-test

[env:atoms3-signal-test]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DMOTOR_ALLOW_POWERED_TESTS=0

; Do not add an upload action to automation. User approval is required before flashing.
