<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e1" />
    <meta name="description" content="OuchiColon の顔アニメーション" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>OuchiColon</title>
  </head>
  <body>
    <main id="app" aria-label="OuchiColon">
      <canvas id="face" aria-label="OuchiColon の顔"></canvas>
      <section id="debug" class="debug" hidden aria-label="デバッグ操作">
        <div class="debug__top"><strong>OuchiColon / DEBUG</strong><button id="minimize-debug" type="button" aria-label="顔を見やすくする">顔を見る</button><button id="close-debug" type="button" aria-label="閉じる">×</button></div>
        <div class="debug__expressions" id="expressions"></div>
        <div class="debug__controls">
          <button id="gaze-left" type="button">視線 ←</button><button id="gaze-center" type="button">中央</button><button id="gaze-right" type="button">視線 →</button>
          <button id="blink-once" type="button">まばたき</button>
          <button id="talk-toggle" type="button">おしゃべり</button>
          <label>口パク <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" /></label>
        </div>
        <div class="debug__tracking" aria-label="顔追跡の操作">
          <strong>顔追跡 / Phase 2</strong>
          <div class="debug__controls">
            <button id="camera-start" type="button">カメラON</button>
            <button id="camera-stop" type="button" disabled>カメラOFF</button>
            <button id="detector-start" type="button" disabled>顔検出ON</button>
            <button id="detector-stop" type="button" disabled>顔検出OFF</button>
          </div>
          <output id="tracking-status" aria-live="polite">停止中。開始すると前面カメラを使用します。</output>
          <output id="tracking-coordinates" aria-live="off">顔座標: --</output>
          <label class="debug__mirror"><input id="mirror-horizontal" type="checkbox" checked /> 左右反転（顔の動きに合わせて調整）</label>
          <small>初回は検出モデル等の読み込みに通信を使います（約15 MB）。映像は表示・保存・送信せず端末内で処理します。端末が前面カメラを塞ぐ場合は少し下向きにしてください。</small>
        </div>
        <output id="fps" class="debug__fps" aria-live="off">FPS: --</output>
        <small>キー 1〜8: 表情 / ← →: 視線 / Space: 口パク</small>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
